<div class="login-page">

  <h1>ورود</h1>

  <form (ngSubmit)="login()">

    <input
      type="text"
      name="national_code"
      [(ngModel)]="national_code"
      placeholder="کد ملی"
      maxlength="10"
      required
    >

    <input
      type="password"
      name="password"
      [(ngModel)]="password"
      placeholder="رمز عبور"
      required
    >

    <button type="submit">
      ورود
    </button>

  </form>

  <p
    class="error"
    *ngIf="errorMessage"
  >
    {{ errorMessage }}
  </p>

</div>

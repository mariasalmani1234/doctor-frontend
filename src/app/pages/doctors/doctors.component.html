<div class="doctors-page">

  <h1>پزشکان</h1>

  <div class="filters">

    <input
      type="text"
      [(ngModel)]="search"
      placeholder="نام پزشک"
    />

    <input
      type="text"
      [(ngModel)]="city"
      placeholder="شهر"
    />

    <button (click)="searchDoctors()">
      جستجو
    </button>

    <button (click)="clearFilters()">
      پاک کردن
    </button>

  </div>

  <p *ngIf="loading">
    در حال دریافت اطلاعات...
  </p>

  <div class="doctor-grid">

    <div
      class="doctor-card"
      *ngFor="let doctor of doctors"
    >

      <div class="doctor-image">
        <img
          *ngIf="doctor.image"
          [src]="doctor.image"
          [alt]="doctor.first_name + ' ' + doctor.last_name"
        />

        <div *ngIf="!doctor.image">
          👨‍⚕️
        </div>
      </div>

      <h2>
        دکتر {{ doctor.first_name }} {{ doctor.last_name }}
      </h2>

      <p>
        تخصص: {{ doctor.specialty_name }}
      </p>

      <p>
        شهر: {{ doctor.city }}
      </p>

      <p>
        سابقه: {{ doctor.experience }} سال
      </p>

      <p>
        ⭐ {{ doctor.rating }}
      </p>

      <button>
        دریافت نوبت
      </button>

    </div>

  </div>

  <p *ngIf="!loading && doctors.length === 0">
    پزشکی پیدا نشد.
  </p>

</div>
